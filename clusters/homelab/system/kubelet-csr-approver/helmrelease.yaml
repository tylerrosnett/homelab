apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kubelet-csr-approver
  namespace: kube-system
spec:
  driftDetection:
    mode: enabled
  interval: 30m
  chart:
    spec:
      chart: kubelet-csr-approver
      version: 1.2.14
      sourceRef:
        kind: HelmRepository
        name: postfinance
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    # Anchored exact-match for our node hostnames.
    # Add more here if/when nodes join.
    providerRegex: '^(oak|maple|pine|birch|cedar)$'
    # IP SAN must fall in this prefix list (LAN /24 covers all three node IPs + VIP).
    providerIpPrefixes: '192.168.1.0/24'
    # Homelab has no per-node DNS records; skip the resolve-back check.
    bypassDnsResolution: true
    # Max cert validity — 24h matches kubelet rotation default.
    maxExpirationSeconds: 86400
