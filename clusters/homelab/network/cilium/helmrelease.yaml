apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
  namespace: kube-system
spec:
  driftDetection:
    mode: enabled
  interval: 30m
  chart:
    spec:
      chart: cilium
      version: 1.20.0
      sourceRef:
        kind: HelmRepository
        name: cilium
        namespace: flux-system
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    rollOutCiliumPods: true
    kubeProxyReplacement: true
    # KubePrism (Talos default, :7445) load-balances across all healthy apiservers per node.
    # The VIP is a single floating endpoint that Talos moves on etcd health, not apiserver
    # health, so a node with healthy etcd but a sick apiserver can hold it and stall Cilium.
    k8sServiceHost: localhost
    k8sServicePort: 7445
    gatewayAPI:
      enabled: true
      xffNumTrustedHops: 1
    ipam:
      mode: kubernetes
    cgroup:
      autoMount:
        enabled: false
      hostRoot: /sys/fs/cgroup
    l2announcements:
      enabled: true
    externalIPs:
      enabled: true
    hubble:
      enabled: true
      relay:
        enabled: true
      ui:
        enabled: true
    k8sClientRateLimit:
      qps: 50
      burst: 100
    securityContext:
      capabilities:
        ciliumAgent:
          - CHOWN
          - KILL
          - NET_ADMIN
          - NET_RAW
          - IPC_LOCK
          - SYS_ADMIN
          - SYS_RESOURCE
          - DAC_OVERRIDE
          - FOWNER
          - SETGID
          - SETUID
        cleanCiliumState:
          - NET_ADMIN
          - SYS_ADMIN
          - SYS_RESOURCE
