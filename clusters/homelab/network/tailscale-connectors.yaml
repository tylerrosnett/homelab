apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tailscale-connectors
  namespace: flux-system
spec:
  dependsOn:
    - name: tailscale
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./clusters/homelab/network/tailscale-connectors
  prune: true
  wait: true
