apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: agentgateway
  namespace: flux-system
spec:
  dependsOn:
    - name: gateway-api               # Gateway/HTTPRoute CRDs
    - name: inference-extension-crds  # controller watches InferencePool
    - name: kyverno-policies
  interval: 10m
  retryInterval: 1m
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./clusters/homelab/network/agentgateway
  prune: true
  wait: true
