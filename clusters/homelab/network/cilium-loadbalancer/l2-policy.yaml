apiVersion: cilium.io/v2alpha1
kind: CiliumL2AnnouncementPolicy
metadata:
  name: default-l2-policy
spec:
  loadBalancerIPs: true
  externalIPs: true
  interfaces:
    - eno1
  # Only control planes announce: they own eno1 (workers have virtio NIC names
  # that don't match `interfaces`, so a worker winning a lease blackholes the IP)
  # and they're the always-on tier (workers power off).
  nodeSelector:
    matchExpressions:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
  serviceSelector:
    matchLabels:
      lb-announce: "true"
