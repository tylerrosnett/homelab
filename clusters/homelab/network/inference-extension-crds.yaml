apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: gateway-api-inference-extension
  namespace: flux-system
spec:
  interval: 12h
  url: https://github.com/kubernetes-sigs/gateway-api-inference-extension
  ref:
    # Renovate's flux manager bumps this tag. llm-d-router and agentgateway must build
    # against the same GIE minor; check both before merging a bump.
    tag: v1.6.2
  ignore: |
    # artifact only needs the CRD kustomization
    /*
    !/config/crd/
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: inference-extension-crds
  namespace: flux-system
spec:
  dependsOn:
    - name: gateway-api
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: gateway-api-inference-extension
  path: ./config/crd
  # prune stays off: pruning the InferencePool CRD cascade-deletes every InferencePool.
  prune: false
  wait: true
