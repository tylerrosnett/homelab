apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cilium-loadbalancer
  namespace: flux-system
spec:
  dependsOn:
    - name: cilium
  interval: 10m
  retryInterval: 1m
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./clusters/homelab/network/cilium-loadbalancer
  prune: true
  wait: true