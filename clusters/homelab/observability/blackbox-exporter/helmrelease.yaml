apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: blackbox-exporter
  namespace: monitoring
spec:
  interval: 30m
  chart:
    spec:
      chart: prometheus-blackbox-exporter
      version: 11.10.0
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    serviceMonitor:
      enabled: true
      defaults:
        labels:
          release: kube-prometheus-stack
        interval: 60s
        scrapeTimeout: 30s
    config:
      modules:
        http_2xx:
          prober: http
          timeout: 10s
          http:
            preferred_ip_protocol: ip4
            valid_status_codes: [200, 301, 302, 401, 403]
            fail_if_ssl: false
            fail_if_not_ssl: true
        http_2xx_insecure:
          prober: http
          timeout: 10s
          http:
            preferred_ip_protocol: ip4
            valid_status_codes: [200, 301, 302, 401, 403]
            tls_config:
              insecure_skip_verify: true
        tcp_connect:
          prober: tcp
          timeout: 5s
