apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
  namespace: monitoring
spec:
  interval: 30m
  chart:
    spec:
      chart: loki
      version: 7.2.0
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    deploymentMode: SingleBinary
    loki:
      auth_enabled: false
      commonConfig:
        replication_factor: 1
      storage:
        type: filesystem
      schemaConfig:
        configs:
          - from: "2024-04-01"
            store: tsdb
            object_store: filesystem
            schema: v13
            index:
              prefix: loki_index_
              period: 24h
      limits_config:
        retention_period: 30d
        # Defaults (4MB/s, 5k streams) drop logs during node-reboot floods —
        # LokiDiscardingSamples fired with reason=rate_limited + stream_limit.
        ingestion_rate_mb: 16
        ingestion_burst_size_mb: 32
        max_global_streams_per_user: 10000
      compactor:
        retention_enabled: true
        delete_request_store: filesystem
    monitoring:
      serviceMonitor:
        enabled: true
    singleBinary:
      replicas: 1
      persistence:
        enabled: true
        storageClass: longhorn
        size: 50Gi
    backend:
      replicas: 0
    read:
      replicas: 0
    write:
      replicas: 0
    test:
      enabled: false
    chunksCache:
      enabled: false
    resultsCache:
      enabled: false
