apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - podmonitor.yaml
generatorOptions:
  disableNameSuffixHash: true
  labels:
    grafana_dashboard: "1"
configMapGenerator:
  - name: flux-dashboard-cluster
    namespace: monitoring
    files:
      - dashboards/cluster.json
  - name: flux-dashboard-control-plane
    namespace: monitoring
    files:
      - dashboards/control-plane.json
  - name: flux-dashboard-logs
    namespace: monitoring
    files:
      - dashboards/logs.json
