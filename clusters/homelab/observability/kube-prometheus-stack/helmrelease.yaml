apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 30m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: 87.12.3
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    kubeControllerManager:
      service:
        port: 10257
        targetPort: 10257
      serviceMonitor:
        https: true
        insecureSkipVerify: true
    kubeScheduler:
      service:
        port: 10259
        targetPort: 10259
      serviceMonitor:
        https: true
        insecureSkipVerify: true
    kubeEtcd:
      service:
        port: 2381
        targetPort: 2381
    kubeProxy:
      enabled: false
    prometheus:
      prometheusSpec:
        externalUrl: https://prometheus.internal.tylerrosnett.com
        retention: 14d
        podMonitorSelectorNilUsesHelmValues: false
        serviceMonitorSelectorNilUsesHelmValues: false
        probeSelectorNilUsesHelmValues: false
        ruleSelectorNilUsesHelmValues: false
        scrapeConfigSelectorNilUsesHelmValues: false
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: longhorn
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 50Gi
    alertmanager:
      alertmanagerSpec:
        externalUrl: https://alertmanager.internal.tylerrosnett.com
        alertmanagerConfigSelector:
          matchLabels:
            alertmanagerConfig: discord
        alertmanagerConfigMatcherStrategy:
          type: None
        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: longhorn
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 5Gi
    grafana:
      deploymentStrategy:
        type: Recreate
        rollingUpdate: null
      persistence:
        enabled: true
        storageClassName: longhorn
        size: 5Gi
      ingress:
        enabled: false
      sidecar:
        dashboards:
          enabled: true
          searchNamespace: ALL
          label: grafana_dashboard
          labelValue: "1"
      additionalDataSources:
        - name: Loki
          type: loki
          access: proxy
          url: http://loki-gateway.monitoring.svc.cluster.local
          isDefault: false
      grafana.ini:
        server:
          root_url: https://grafana.tylerrosnett.com
        auth:
          disable_login_form: true
          disable_signout_menu: true
        auth.anonymous:
          enabled: false
        auth.basic:
          enabled: false
        auth.jwt:
          enabled: true
          header_name: Cf-Access-Jwt-Assertion
          email_claim: email
          username_claim: email
          jwk_set_url: https://tylerrosnett.cloudflareaccess.com/cdn-cgi/access/certs
          expected_claims: '{"aud": "c640c5ca28f239d554abc8174ffb6d95726dd9aacaf2af106b1b8405b01e5a42"}'
          auto_sign_up: true
        users:
          auto_assign_org_role: Admin
