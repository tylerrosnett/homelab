apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: alloy
  namespace: monitoring
spec:
  interval: 30m
  chart:
    spec:
      chart: alloy
      version: 1.11.1
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    controller:
      type: daemonset
      volumes:
        extra:
          - name: audit-logs
            hostPath:
              path: /var/log/audit/kube
              type: DirectoryOrCreate
    alloy:
      mounts:
        extra:
          - name: audit-logs
            mountPath: /var/log/audit/kube
            readOnly: true
      configMap:
        create: true
        content: |
          loki.write "default" {
            endpoint {
              url = "http://loki-gateway.monitoring.svc.cluster.local/loki/api/v1/push"
            }
          }

          discovery.kubernetes "pods" {
            role = "pod"
          }

          discovery.relabel "pods" {
            targets = discovery.kubernetes.pods.targets
            rule {
              source_labels = ["__meta_kubernetes_namespace"]
              target_label  = "namespace"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_name"]
              target_label  = "pod"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_container_name"]
              target_label  = "container"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_node_name"]
              target_label  = "node"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_label_app"]
              target_label  = "app"
            }
          }

          loki.source.kubernetes "pods" {
            targets    = discovery.relabel.pods.output
            forward_to = [loki.write.default.receiver]
          }

          local.file_match "audit" {
            path_targets = [{
              __path__ = "/var/log/audit/kube/kube-apiserver-audit*.log",
              job      = "kube-apiserver-audit",
              node     = sys.env("HOSTNAME"),
            }]
          }

          // No label promotion here on purpose. Promoting audit fields (verb, user,
          // resource, ...) to labels made one stream per combination — 10k+ active
          // streams, Loki's stream_limit discarding logs. Filter at query time:
          //   {job="kube-apiserver-audit"} | json | verb="delete"
          loki.source.file "audit" {
            targets    = local.file_match.audit.targets
            forward_to = [loki.write.default.receiver]
          }
