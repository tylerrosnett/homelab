apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
generatorOptions:
  disableNameSuffixHash: true
  labels:
    grafana_dashboard: "1"
configMapGenerator:
  - name: dashboard-cert-manager
    namespace: monitoring
    files:
      - dashboards/cert-manager.json
  - name: dashboard-cilium-agent
    namespace: monitoring
    files:
      - dashboards/cilium-agent.json
  - name: dashboard-longhorn
    namespace: monitoring
    files:
      - dashboards/longhorn.json
  - name: dashboard-node-exporter-full
    namespace: monitoring
    files:
      - dashboards/node-exporter-full.json
  - name: dashboard-loki
    namespace: monitoring
    files:
      - dashboards/loki.json
