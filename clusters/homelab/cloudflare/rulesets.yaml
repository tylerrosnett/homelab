apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cloudflare-rulesets
  namespace: flux-system
spec:
  dependsOn:
    - name: crossplane-provider-config
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./clusters/homelab/cloudflare/rulesets
  prune: true
  wait: true
