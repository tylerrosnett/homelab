apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cloudflare-dns
  namespace: flux-system
spec:
  dependsOn:
    - name: crossplane-provider-config
    - name: external-dns-crds
    - name: external-dns
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./clusters/homelab/cloudflare/dns
  prune: true
  wait: true
