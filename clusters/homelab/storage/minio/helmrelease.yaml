apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: minio
  namespace: storage
spec:
  driftDetection:
    mode: enabled
  interval: 30m
  chart:
    spec:
      chart: minio
      version: 5.4.0
      sourceRef:
        kind: HelmRepository
        name: minio
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    mode: standalone
    replicas: 1
    # RWO Longhorn PVC — the chart default (RollingUpdate, maxSurge 100%) surges a second
    # pod that can never attach the volume, wedging the rollout. Same trap as Grafana.
    deploymentUpdate:
      type: Recreate
    existingSecret: minio-root
    persistence:
      enabled: true
      storageClass: longhorn
      size: 20Gi
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
    securityContext:
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault
    containerSecurityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
    postJob:
      securityContext:
        enabled: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
    makeBucketJob:
      securityContext:
        enabled: true
        runAsUser: 1000
        runAsGroup: 1000
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
    makeUserJob:
      securityContext:
        enabled: true
        runAsUser: 1000
        runAsGroup: 1000
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
    buckets:
      - name: outline
        policy: none
        purge: false
    users:
      - accessKey: outline
        existingSecret: minio-root
        existingSecretKey: outline-secretkey
        policy: readwrite
    ingress:
      enabled: false
    consoleIngress:
      enabled: false
  # The chart has no probe support at all (nothing in the deployment template),
  # so they're grafted on. MinIO's health endpoints are unauthenticated by design.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: minio
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: minio
              spec:
                template:
                  spec:
                    containers:
                      - name: minio
                        livenessProbe:
                          httpGet:
                            path: /minio/health/live
                            port: 9000
                          periodSeconds: 30
                        readinessProbe:
                          httpGet:
                            path: /minio/health/ready
                            port: 9000
                          periodSeconds: 10
