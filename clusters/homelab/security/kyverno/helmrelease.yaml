apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kyverno
  namespace: kyverno
spec:
  driftDetection:
    mode: enabled
  interval: 30m
  chart:
    spec:
      chart: kyverno
      version: 3.9.0
      sourceRef:
        kind: HelmRepository
        name: kyverno
        namespace: flux-system
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    grafana:
      enabled: true
      labels:
        grafana_dashboard: "1"
    admissionController:
      # 3 replicas before any Enforce policy: a single replica behind a
      # failing-closed webhook blocks all admission when its pod dies.
      replicas: 3
      serviceMonitor:
        enabled: true
      rbac:
        clusterRole:
          extraResources:
            - apiGroups:
                - cilium.io
              resources:
                - ciliumnetworkpolicies
              verbs:
                - get
                - list
                - watch
    reportsController:
      serviceMonitor:
        enabled: true
      rbac:
        clusterRole:
          extraResources:
            - apiGroups:
                - cilium.io
              resources:
                - ciliumnetworkpolicies
              verbs:
                - get
                - list
                - watch
    backgroundController:
      serviceMonitor:
        enabled: true
