apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-requests
  annotations:
    policies.kyverno.io/title: Require Resource Requests
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Every container must declare CPU and memory requests so the scheduler
      can place pods honestly. The nano-preset Postgres taught this lesson.
spec:
  validationActions: [Deny]
  failurePolicy: Fail
  matchConstraints:
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values:
              - kube-system
              - flux-system
              - longhorn-system
              - monitoring
              - tailscale
              - cert-manager
              - kyverno
              - home-assistant
              - gpu-operator
              - model-csi
              - dragonfly
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
  validations:
    - expression: >-
        (object.spec.containers +
          (has(object.spec.initContainers) ? object.spec.initContainers : [])).all(c,
          has(c.resources) && has(c.resources.requests) &&
          'cpu' in c.resources.requests && 'memory' in c.resources.requests)
      message: CPU and memory resource requests are required for all containers.
---
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-requests-audit
  annotations:
    policies.kyverno.io/title: Require Resource Requests
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Every container must declare CPU and memory requests so the scheduler
      can place pods honestly. The nano-preset Postgres taught this lesson.
spec:
  # Audit-only twin for the infrastructure namespaces the Deny policy skips. Fails open so
  # a Kyverno outage can never block pods in kube-system, kyverno or longhorn-system.
  validationActions: [Audit]
  failurePolicy: Ignore
  matchConstraints:
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values:
              - kube-system
              - flux-system
              - longhorn-system
              - monitoring
              - tailscale
              - cert-manager
              - kyverno
              - home-assistant
              - gpu-operator
              - model-csi
              - dragonfly
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
  validations:
    - expression: >-
        (object.spec.containers +
          (has(object.spec.initContainers) ? object.spec.initContainers : [])).all(c,
          has(c.resources) && has(c.resources.requests) &&
          'cpu' in c.resources.requests && 'memory' in c.resources.requests)
      message: CPU and memory resource requests are required for all containers.
