apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-probes
  annotations:
    pod-policies.kyverno.io/autogen-controllers: DaemonSet,Deployment,StatefulSet
    policies.kyverno.io/title: Require Pod Probes
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Each container must define at least one of livenessProbe, readinessProbe,
      or startupProbe so deployments, restarts, and upgrades are managed
      correctly.
spec:
  validationFailureAction: Enforce
  validationFailureActionOverrides:
    - action: Audit
      namespaces:
        - kube-system
        - flux-system
        - longhorn-system
        - monitoring
        - crossplane-system
        - tailscale
        - cert-manager
        - kyverno
        - home-assistant
  background: true
  failurePolicy: Fail
  rules:
    - name: validate-probes
      match:
        any:
          - resources:
              kinds:
                - Pod
      preconditions:
        all:
          - key: "{{request.operation || 'BACKGROUND'}}"
            operator: AnyIn
            value:
              - CREATE
              - UPDATE
          # Job and CronJob pods are batch workloads; probes make no sense on
          # them and requiring them would deny every helper/hook job.
          - key: "{{ request.object.metadata.ownerReferences[0].kind || 'none' }}"
            operator: AnyNotIn
            value:
              - Job
      validate:
        message: "Liveness, readiness, or startup probes are required for all containers."
        foreach:
          - list: request.object.spec.containers[]
            deny:
              conditions:
                all:
                  - key: livenessProbe
                    operator: AllNotIn
                    value: "{{ element.keys(@)[] }}"
                  - key: startupProbe
                    operator: AllNotIn
                    value: "{{ element.keys(@)[] }}"
                  - key: readinessProbe
                    operator: AllNotIn
                    value: "{{ element.keys(@)[] }}"
