apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kyverno-policies
  namespace: kyverno
spec:
  driftDetection:
    mode: enabled
  interval: 30m
  chart:
    spec:
      chart: kyverno-policies
      version: 3.9.0
      sourceRef:
        kind: HelmRepository
        name: kyverno
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    podSecurityStandard: restricted
    validationFailureAction: Enforce
    failurePolicy: Fail
    validationFailureActionOverrides:
      all:
        - action: Audit
          namespaces:
            - kube-system
            - flux-system
            - longhorn-system
            - monitoring
            - crossplane-system
            - tailscale
            - cert-manager
            - kyverno
            - home-assistant
