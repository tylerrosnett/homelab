apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: trivy-operator
  namespace: flux-system
spec:
  dependsOn:
    - name: kube-prometheus-stack   # ServiceMonitor CRD
    - name: longhorn                # trivy-server PVC
  interval: 10m
  retryInterval: 1m
  timeout: 15m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./clusters/homelab/security/trivy-operator
  prune: true
  wait: true
