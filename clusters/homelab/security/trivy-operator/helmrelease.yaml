apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: trivy-operator
  namespace: trivy-system
spec:
  driftDetection:
    mode: enabled
  interval: 30m
  chart:
    spec:
      chart: trivy-operator
      version: 0.38.1
      sourceRef:
        kind: HelmRepository
        name: aquasecurity
        namespace: flux-system
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    # vLLM's multi-GB CUDA image: findings are only fixable by a vLLM bump,
    # which Renovate already proposes.
    excludeNamespaces: inference
    operator:
      builtInTrivyServer: true
      scanJobsConcurrentLimit: 3
      # Scan jobs pull and unpack the image client-side; multi-GB images (vLLM)
      # at 500m CPU exceed the 5m default and retry forever, re-pulling each time.
      scanJobTimeout: 20m
      # SbomReports for large images exceed etcd's request size and force
      # re-scans; nothing here consumes SBOMs.
      sbomGenerationEnabled: false
      # Node-collector (infra assessment + CIS compliance) checks kubelet/etcd
      # file paths that do not exist on Talos; every finding would be noise.
      infraAssessmentScannerEnabled: false
      clusterComplianceEnabled: false
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 512Mi
    trivy:
      storageClassName: longhorn
      timeout: 20m0s
      # Scan jobs; large images (vLLM) need more than the chart's 500M.
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 1Gi
    serviceMonitor:
      enabled: true
      labels:
        release: kube-prometheus-stack
