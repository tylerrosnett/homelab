apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: model-csi
  namespace: flux-system
spec:
  dependsOn:
    - name: kyverno-policies        # model-csi Audit override must exist before its pods
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  interval: 10m
  retryInterval: 1m
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./clusters/homelab/model-csi
  prune: true
  # wait: false — the driver only runs on willow, which is often absent.
  wait: false
