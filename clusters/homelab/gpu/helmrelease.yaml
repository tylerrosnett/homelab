apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gpu-operator
  namespace: gpu-operator
spec:
  driftDetection:
    mode: enabled
  interval: 30m
  timeout: 10m
  chart:
    spec:
      chart: gpu-operator
      version: v26.7.2
      sourceRef:
        kind: HelmRepository
        name: nvidia
        namespace: flux-system
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    # Talos ships the driver and the container toolkit as system extensions
    # (schematics/willow.yaml); the operator must not install either. The
    # extension puts the driver under /usr/local, not /run/nvidia/driver.
    driver:
      enabled: false
    toolkit:
      enabled: false
    hostPaths:
      driverInstallDir: /usr/local
    operator:
      # Flux owns the CRDs (crds: CreateReplace); the chart's pre-upgrade CRD
      # Job would only duplicate that.
      upgradeCRD: false
