apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
spec:
  dependsOn:
    - name: gateway                 # HTTPRoutes attach to cilium-gateway / cf-tunnel
    - name: kube-prometheus-stack   # ServiceMonitor CRDs (blocky, home-assistant)
    - name: longhorn                # storageClass for the home-assistant / minecraft PVCs
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  interval: 10m
  retryInterval: 1m
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./clusters/homelab/apps
  prune: true
  # wait: false — nothing depends on apps, and minecraft's first boot (mod download +
  # world gen) runs well past any sane timeout. Waiting here buys nothing but false alarms.
  wait: false
