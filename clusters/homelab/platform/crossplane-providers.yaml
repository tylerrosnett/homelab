apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: crossplane-providers
  namespace: flux-system
spec:
  dependsOn:
    - name: crossplane
  interval: 10m
  retryInterval: 1m
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./clusters/homelab/platform/crossplane-providers
  prune: true
  wait: true
  healthChecks:
    - apiVersion: pkg.crossplane.io/v1
      kind: Provider
      name: provider-cloudflare-dns
    - apiVersion: pkg.crossplane.io/v1
      kind: Provider
      name: provider-cloudflare-zone
    - apiVersion: pkg.crossplane.io/v1
      kind: Provider
      name: provider-cloudflare-access
    - apiVersion: pkg.crossplane.io/v1
      kind: Provider
      name: provider-cloudflare-zero
