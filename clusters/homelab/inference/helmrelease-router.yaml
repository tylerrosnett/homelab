apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  # The InferencePool takes the release name.
  name: vllm
  namespace: inference
spec:
  driftDetection:
    mode: enabled
  interval: 30m
  timeout: 10m
  chart:
    spec:
      chart: llm-d-router-gateway
      version: v1.0.0
      sourceRef:
        kind: HelmRepository
        name: llm-d
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    provider:
      name: none
    # Own HTTPRoute in httproute-pool.yaml.
    httpRoute:
      create: false
    router:
      modelServers:
        matchLabels:
          app: vllm
      epp:
        image:
          tag: v1.0.0@sha256:024188e998f516879f68532016ca24fabca00afbdcc2af9a61b17634e197df2c
        # Chart default requests 8 CPU / 8Gi, sized for large fleets.
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 1Gi
        podSecurityContext:
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
      monitoring:
        prometheus:
          enabled: true
          # Plain /metrics so the ServiceMonitor needs no bearer token Secret.
          auth:
            enabled: false
          extraLabels:
            release: kube-prometheus-stack
