apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: llm-internal
  namespace: inference
spec:
  parentRefs:
    - name: cilium-gateway
      namespace: kube-system
  hostnames:
    - llm.internal.tylerrosnett.com
  rules:
    # The Service agentgateway generates for Gateway inference-gateway.
    - backendRefs:
        - name: inference-gateway
          port: 8080
      timeouts:
        request: 600s
