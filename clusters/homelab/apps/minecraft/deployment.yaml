apiVersion: apps/v1
kind: Deployment
metadata:
  name: minecraft
  namespace: minecraft
spec:
  replicas: 1
  strategy:
    type: Recreate  # RWO PVC — RollingUpdate deadlocks (same as Grafana)
  selector:
    matchLabels:
      app: minecraft
  template:
    metadata:
      labels:
        app: minecraft
    spec:
      nodeSelector:
        homelab/node-class: game
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: minecraft
          image: itzg/minecraft-server:2026.8.1-java21
          env:
            - name: EULA
              value: "TRUE"
            - name: TYPE
              value: AUTO_CURSEFORGE
            - name: CF_SLUG
              value: all-the-mods-10
            - name: CF_FILE_ID
              value: "8649077"
            - name: CF_API_KEY
              valueFrom:
                secretKeyRef:
                  name: curseforge
                  key: CF_API_KEY
            - name: MODS  # server-side only; clients connect without them
              value: |-
                https://cdn.modrinth.com/data/gvQqBUqZ/versions/DDUrRVCA/lithium-neoforge-0.15.4%2Bmc1.21.1.jar
                https://cdn.modrinth.com/data/l6YH9Als/versions/v5qtqRQi/spark-1.10.124-neoforge.jar
                https://cdn.modrinth.com/data/fALzjamp/versions/LuFhm4eU/Chunky-NeoForge-1.4.23.jar
            - name: MEMORY
              value: 12G
            - name: USE_AIKAR_FLAGS
              value: "true"
            - name: ALLOW_FLIGHT
              value: "TRUE"
            - name: ENABLE_WHITELIST
              value: "TRUE"
            - name: ENFORCE_WHITELIST
              value: "TRUE"
            - name: WHITELIST
              valueFrom:
                secretKeyRef:
                  name: minecraft-whitelist
                  key: WHITELIST
            - name: OPS
              valueFrom:
                secretKeyRef:
                  name: minecraft-whitelist
                  key: OPS
            - name: MOTD
              value: All The Mods 10
            - name: LEVEL
              value: world1  # new level name = fresh world; old one stays at /data/world until deleted
            - name: VIEW_DISTANCE
              value: "10"
            - name: SIMULATION_DISTANCE
              value: "4"
            - name: SYNC_CHUNK_WRITES
              value: "false"  # async chunk saves — sync writes pay Longhorn replication latency on the main thread
            - name: TZ
              value: America/Los_Angeles
            - name: CREATE_CONSOLE_IN_PIPE
              value: "true"
          ports:
            - name: minecraft
              containerPort: 25565
              protocol: TCP
          startupProbe:
            exec:
              command: ["mc-health"]
            periodSeconds: 10
            failureThreshold: 120  # first boot downloads ~300 mods + generates world
          readinessProbe:
            exec:
              command: ["mc-health"]
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["mc-health"]
            periodSeconds: 30
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: "8"
              memory: 16Gi
            limits:
              memory: 40Gi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: minecraft-data
