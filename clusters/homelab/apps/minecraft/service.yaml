apiVersion: v1
kind: Service
metadata:
  name: minecraft
  namespace: minecraft
  labels:
    lb-announce: "true"
  annotations:
    # Tailscale operator exposes this Service as its own tailnet device.
    tailscale.com/expose: "true"
    tailscale.com/hostname: minecraft
    tailscale.com/tags: tag:minecraft
spec:
  type: LoadBalancer
  loadBalancerIP: 192.168.1.203
  selector:
    app: minecraft
  ports:
    - name: minecraft
      port: 25565
      targetPort: minecraft
      protocol: TCP
