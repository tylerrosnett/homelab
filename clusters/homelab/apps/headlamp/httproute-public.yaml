apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: headlamp-public
  namespace: headlamp
spec:
  parentRefs:
    - name: cf-tunnel
      namespace: kube-system
      sectionName: http
  hostnames:
    - headlamp.tylerrosnett.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: headlamp
          port: 80
