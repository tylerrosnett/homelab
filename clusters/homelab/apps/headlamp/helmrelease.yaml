apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: headlamp
  namespace: headlamp
spec:
  interval: 30m
  chart:
    spec:
      chart: headlamp
      version: 0.42.0
      sourceRef:
        kind: HelmRepository
        name: headlamp
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    serviceAccount:
      create: true
    clusterRoleBinding:
      create: true
      clusterRoleName: cluster-admin
    ingress:
      enabled: false
    config:
      oidc:
        secret:
          create: false
          name: headlamp-oidc
        scopes: openid email profile groups
        callbackURL: https://headlamp.internal.tylerrosnett.com/oidc-callback
