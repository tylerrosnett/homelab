apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: headlamp
  namespace: headlamp
spec:
  driftDetection:
    mode: enabled
  interval: 30m
  chart:
    spec:
      chart: headlamp
      version: 0.45.0
      sourceRef:
        kind: HelmRepository
        name: headlamp
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  valuesFrom:
    - kind: Secret
      name: headlamp-oidc
      valuesKey: clientID
      targetPath: config.oidc.clientID
    - kind: Secret
      name: headlamp-oidc
      valuesKey: clientSecret
      targetPath: config.oidc.clientSecret
    - kind: Secret
      name: headlamp-oidc
      valuesKey: issuerURL
      targetPath: config.oidc.issuerURL
  values:
    serviceAccount:
      create: true
    clusterRoleBinding:
      create: true
      clusterRoleName: cluster-admin
    ingress:
      enabled: false
    config:
      oidc:
        scopes: openid email profile groups offline_access
        callbackURL: https://headlamp.tylerrosnett.com/oidc-callback
        usePKCE: true
    podSecurityContext:
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
    resources:
      requests:
        cpu: 25m
        memory: 128Mi
      limits:
        memory: 256Mi
