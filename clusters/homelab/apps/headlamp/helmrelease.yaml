apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: headlamp
  namespace: headlamp
spec:
  interval: 30m
  chart:
    spec:
      chart: headlamp
      version: 0.42.0
      sourceRef:
        kind: HelmRepository
        name: headlamp
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  valuesFrom:
    - kind: Secret
      name: headlamp-oidc
      valuesKey: clientID
      targetPath: config.oidc.clientID
    - kind: Secret
      name: headlamp-oidc
      valuesKey: clientSecret
      targetPath: config.oidc.clientSecret
    - kind: Secret
      name: headlamp-oidc
      valuesKey: issuerURL
      targetPath: config.oidc.issuerURL
  values:
    serviceAccount:
      create: true
    clusterRoleBinding:
      create: true
      clusterRoleName: cluster-admin
    ingress:
      enabled: false
    config:
      oidc:
        scopes: openid email profile groups
        callbackURL: https://headlamp.internal.tylerrosnett.com/oidc-callback
        usePKCE: true
