# Seed config for Zigbee2MQTT. Copied to the PVC by an initContainer ONLY if
# /app/data/configuration.yaml does not exist yet; after that Z2M owns the file on the PVC
# (it writes the generated network key, pan_id, devices, groups into it). Editing this
# ConfigMap later does nothing to a running install — change settings in the Z2M UI.
apiVersion: v1
kind: ConfigMap
metadata:
  name: zigbee2mqtt-seed
  namespace: home-assistant
data:
  configuration.yaml: |
    version: 4
    homeassistant:
      enabled: true
    frontend:
      enabled: true
      port: 8080
    mqtt:
      base_topic: zigbee2mqtt
      server: mqtt://mosquitto.home-assistant.svc.cluster.local:1883
    serial:
      # SLZB-MR1U radio 2 (CC2652P7) in Zigbee coordinator mode, network port 7638
      port: tcp://10.10.10.168:7638
      adapter: zstack
    advanced:
      # Fixed at first start; changing later means re-pairing every device.
      # 20 sits between Wi-Fi channels 6 and 11 and 4 channels away from Thread (16).
      channel: 20
      network_key: GENERATE
      pan_id: GENERATE
      ext_pan_id: GENERATE
      log_level: info
      last_seen: ISO_8601_local
