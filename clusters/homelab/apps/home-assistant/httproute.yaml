apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: home-assistant
  namespace: home-assistant
spec:
  parentRefs:
    - name: cilium-gateway
      namespace: kube-system
  hostnames:
    - homeassistant.internal.tylerrosnett.com
    - ha.internal.tylerrosnett.com
  rules:
    - backendRefs:
        - name: home-assistant
          port: 8123
