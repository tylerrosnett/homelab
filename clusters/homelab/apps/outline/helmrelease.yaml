apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: outline
  namespace: outline
spec:
  driftDetection:
    mode: enabled
  interval: 30m
  chart:
    spec:
      chart: outline
      version: 0.9.5
      sourceRef:
        kind: HelmRepository
        name: outline
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    url: https://outline.tylerrosnett.com
    web:
      forceHttps: false
    replicaCount: 1
    podSecurityContext:
      seccompProfile:
        type: RuntimeDefault
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        memory: 1Gi
    ingress:
      enabled: false
    postgresql:
      enabled: false
    # CNPG Cluster outline-db (cluster.yaml); outline-db-app is generated by CNPG.
    externalPostgresql:
      host: outline-db-rw
      username: outline
      database: outline
      existingSecret: outline-db-app
      passwordSecretKey: password
    redis:
      enabled: true
      # Same :latest-default pin as postgres; 8.0.3 is the running version.
      image:
        tag: 8.0.3-debian-12-r3
      auth:
        enabled: false
      master:
        persistence:
          enabled: true
          storageClass: longhorn
          size: 2Gi
        # Same nano-preset escape as postgres; no CPU limit.
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 512Mi
    fileStorage:
      mode: s3
      s3:
        existingSecret: outline-secrets
        accessKeyIdSecretKey: access-key-id
        secretAccessKeySecretKey: secret-access-key
        bucket: outline
        region: garage
        bucketUrl: https://files.tylerrosnett.com
        forcePathStyle: true
    secretKeyExternalSecret:
      name: outline-secrets
      key: secret-key
    utilsSecretExternalSecret:
      name: outline-secrets
      key: utils-secret
    extraSecretNamesForEnvFrom:
      - outline-secrets
