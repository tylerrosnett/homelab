apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: outline
  namespace: outline
spec:
  driftDetection:
    mode: enabled
  interval: 30m
  chart:
    spec:
      chart: outline
      version: 0.9.4
      sourceRef:
        kind: HelmRepository
        name: outline
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  valuesFrom:
    - kind: Secret
      name: outline-secrets
      valuesKey: postgres-password
      targetPath: postgresql.auth.password
  values:
    url: https://outline.tylerrosnett.com
    web:
      forceHttps: false
    replicaCount: 1
    podSecurityContext:
      seccompProfile:
        type: RuntimeDefault
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        memory: 1Gi
    ingress:
      enabled: false
    postgresql:
      enabled: true
      # Pin the subchart's bitnamilegacy image (chart default is :latest, a
      # floating tag on a database). Same 17.5 minor as the running server —
      # never bump the major here without a pg_upgrade plan.
      image:
        tag: 17.5.0-debian-12-r20
      auth:
        username: outline
        database: outline
      primary:
        persistence:
          enabled: true
          storageClass: longhorn
          size: 5Gi
        # Overrides the chart's "nano" resourcesPreset (150m CPU / 192Mi limits),
        # which throttled postgres in ~54% of scheduling periods. No CPU limit on
        # purpose — throttling a single-tenant DB buys nothing.
        resources:
          requests:
            cpu: 250m
            memory: 256Mi
          limits:
            memory: 1Gi
    redis:
      enabled: true
      # Same :latest-default pin as postgres; 8.0.3 is the running version.
      image:
        tag: 8.0.3-debian-12-r3
      auth:
        enabled: false
      master:
        persistence:
          enabled: true
          storageClass: longhorn
          size: 2Gi
        # Same nano-preset escape as postgres; no CPU limit.
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 512Mi
    fileStorage:
      mode: s3
      s3:
        existingSecret: outline-secrets
        accessKeyIdSecretKey: access-key-id
        secretAccessKeySecretKey: secret-access-key
        bucket: outline
        region: us-east-1
        bucketUrl: https://files.tylerrosnett.com
        forcePathStyle: true
        acl: private
    secretKeyExternalSecret:
      name: outline-secrets
      key: secret-key
    utilsSecretExternalSecret:
      name: outline-secrets
      key: utils-secret
    extraSecretNamesForEnvFrom:
      - outline-secrets
