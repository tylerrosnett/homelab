apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: outline-db
  namespace: outline
  annotations:
    # CNPG owns the PVC; pruning this Cluster deletes Outline's data, and a
    # re-applied Cluster bootstraps an empty database. Keep until backups exist.
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  instances: 1
  # Default primary PDB (minAvailable 1) makes a single instance unevictable
  # and stalls node drains / talosctl upgrade.
  enablePDB: false
  imageName: ghcr.io/cloudnative-pg/postgresql:17.12-minimal-trixie
  storage:
    storageClass: longhorn
    size: 5Gi
  # Requests also land on the bootstrap-controller init container and CNPG's
  # Job pods; Kyverno require-requests denies those pods without them.
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi
  postgresql:
    # Inserted before CNPG's default `host all all all scram-sha-256` rule;
    # CNPG's own connections use the local socket or hostssl certs.
    pg_hba:
      - hostnossl all all all reject
  monitoring:
    # Deprecated in CNPG; scraped by podmonitor.yaml instead.
    enablePodMonitor: false
  bootstrap:
    initdb:
      database: outline
      owner: outline
