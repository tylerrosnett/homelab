apiVersion: v1
kind: Service
metadata:
  name: blocky-dns
  namespace: blocky
  labels:
    lb-announce: "true"
spec:
  type: LoadBalancer
  loadBalancerIP: 192.168.1.202
  selector:
    app: blocky
  ports:
    - name: dns-udp
      port: 53
      targetPort: dns-udp
      protocol: UDP
    - name: dns-tcp
      port: 53
      targetPort: dns-tcp
      protocol: TCP
