apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: open-webui
  namespace: open-webui
spec:
  parentRefs:
    - name: cf-tunnel
      namespace: kube-system
  hostnames:
    - llm.tylerrosnett.com
  rules:
    - backendRefs:
        - name: open-webui
          port: 80
      timeouts:
        request: 600s
