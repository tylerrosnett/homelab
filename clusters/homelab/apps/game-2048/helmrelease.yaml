apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: game-2048
  namespace: game-2048
spec:
  interval: 30m
  chart:
    spec:
      chart: game-2048
      version: 0.1.2
      sourceRef:
        kind: HelmRepository
        name: devpro
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 64Mi
  # The chart templates no securityContext, so it's grafted on here. nginx
  # runs non-root with NET_BIND_SERVICE for :80 — same pattern as blocky.
  # 499:486 is the image's own nginx user; /var/lib/nginx is 750 nginx:nginx,
  # so any other uid gets EACCES before reaching the tmp mount. The tmp
  # emptyDir exists because readOnlyRootFilesystem blocks writes everywhere
  # else; /var/log/nginx stays unmounted because the image symlinks its logs
  # to stdout/stderr and a mount would hide that.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: game-2048
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: game-2048
              spec:
                template:
                  spec:
                    securityContext:
                      runAsNonRoot: true
                      runAsUser: 499
                      runAsGroup: 486
                      seccompProfile:
                        type: RuntimeDefault
                    containers:
                      - name: webapp
                        securityContext:
                          allowPrivilegeEscalation: false
                          readOnlyRootFilesystem: true
                          capabilities:
                            drop:
                              - ALL
                            add:
                              - NET_BIND_SERVICE
                        volumeMounts:
                          - name: nginx-tmp
                            mountPath: /var/lib/nginx/tmp
                          - name: nginx-run
                            mountPath: /run
                    volumes:
                      - name: nginx-tmp
                        emptyDir: {}
                      - name: nginx-run
                        emptyDir: {}
