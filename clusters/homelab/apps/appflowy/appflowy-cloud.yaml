apiVersion: apps/v1
kind: Deployment
metadata:
  name: appflowy-cloud
  namespace: appflowy
spec:
  replicas: 1
  selector:
    matchLabels: { app: appflowy-cloud }
  template:
    metadata:
      labels: { app: appflowy-cloud }
    spec:
      containers:
        - name: appflowy-cloud
          image: appflowyinc/appflowy_cloud
          envFrom:
            - configMapRef: { name: appflowy-env }
          env:
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: appflowy-secrets, key: POSTGRES_PASSWORD } }
            - name: APPFLOWY_DATABASE_URL
              value: "postgres://postgres:$(POSTGRES_PASSWORD)@postgres:5432/postgres"
            - name: APPFLOWY_GOTRUE_JWT_SECRET
              valueFrom: { secretKeyRef: { name: appflowy-secrets, key: GOTRUE_JWT_SECRET } }
            - name: APPFLOWY_S3_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: appflowy-secrets, key: AWS_ACCESS_KEY } }
            - name: APPFLOWY_S3_SECRET_KEY
              valueFrom: { secretKeyRef: { name: appflowy-secrets, key: AWS_SECRET } }
          ports:
            - { name: http, containerPort: 8000 }
          readinessProbe:
            httpGet: { path: /api/health, port: 8000 }
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 18
---
apiVersion: v1
kind: Service
metadata:
  name: appflowy-cloud
  namespace: appflowy
spec:
  selector: { app: appflowy-cloud }
  ports:
    - { name: http, port: 8000, targetPort: 8000 }
