apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-conf
  namespace: appflowy
data:
  nginx.conf: |
    events {
        worker_connections 1024;
    }
    http {
        map $http_upgrade $connection_upgrade {
            default upgrade;
            '' close;
        }

        server {
            listen 8080;
            location = /stub_status {
                stub_status;
            }
        }

        server {
            listen 80;
            client_max_body_size 10M;
            underscores_in_headers on;

            set $appflowy_cloud_backend "http://appflowy-cloud:8000";
            set $gotrue_backend "http://gotrue:9999";
            set $admin_frontend_backend "http://admin-frontend:3000";
            set $appflowy_web_backend "http://appflowy-web:80";
            set $minio_api_backend "http://minio:9000";
            set $minio_internal_host "minio:9000";

            # GoTrue
            location /gotrue/ {
                proxy_pass $gotrue_backend;
                rewrite ^/gotrue(/.*)$ $1 break;
                proxy_set_header Host $http_host;
                proxy_pass_request_headers on;
            }

            # WebSocket
            location /ws {
                proxy_pass $appflowy_cloud_backend;
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection "Upgrade";
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_read_timeout 86400s;
            }

            location /api {
                proxy_pass $appflowy_cloud_backend;
                proxy_set_header X-Request-Id $request_id;
                proxy_set_header Host $http_host;

                location ~* ^/api/workspace/([a-zA-Z0-9_-]+)/publish$ {
                    proxy_pass $appflowy_cloud_backend;
                    proxy_request_buffering off;
                    client_max_body_size 256M;
                }

                location /api/chat {
                    proxy_pass $appflowy_cloud_backend;
                    proxy_http_version 1.1;
                    proxy_set_header Connection "";
                    chunked_transfer_encoding on;
                    proxy_buffering off;
                    proxy_cache off;
                    proxy_read_timeout 600s;
                    proxy_connect_timeout 600s;
                    proxy_send_timeout 600s;
                }

                location /api/import {
                    proxy_pass $appflowy_cloud_backend;
                    proxy_set_header X-Request-Id $request_id;
                    proxy_set_header Host $http_host;
                    proxy_read_timeout 600s;
                    proxy_connect_timeout 600s;
                    proxy_send_timeout 600s;
                    proxy_request_buffering off;
                    proxy_buffering off;
                    proxy_cache off;
                    client_max_body_size 2G;
                }
            }

            # MinIO presigned URLs
            location /minio-api/ {
                proxy_pass $minio_api_backend;
                proxy_set_header Host $minio_internal_host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                rewrite ^/minio-api/(.*) /$1 break;
                proxy_connect_timeout 300s;
                proxy_read_timeout 600s;
                proxy_send_timeout 600s;
                proxy_request_buffering off;
                proxy_http_version 1.1;
                proxy_set_header Connection "";
                chunked_transfer_encoding off;
                client_max_body_size 0;
            }

            # Admin console
            location /console {
                proxy_pass $admin_frontend_backend;
                proxy_set_header X-Forwarded-Host $http_host;
                proxy_set_header Host $http_host;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Scheme $scheme;
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection 'upgrade';
                proxy_cache_bypass $http_upgrade;
            }

            # AppFlowy Web (catch-all)
            location / {
                proxy_pass $appflowy_web_backend;
                proxy_set_header X-Scheme $scheme;
                proxy_set_header Host $host;
            }
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: appflowy
spec:
  replicas: 1
  selector:
    matchLabels: { app: nginx }
  template:
    metadata:
      labels: { app: nginx }
    spec:
      containers:
        - name: nginx
          image: nginx:1.31.2
          ports:
            - { name: http, containerPort: 80 }
            - { name: stub, containerPort: 8080 }
          volumeMounts:
            - { name: conf, mountPath: /etc/nginx/nginx.conf, subPath: nginx.conf }
          readinessProbe:
            httpGet: { path: /stub_status, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: conf
          configMap: { name: nginx-conf }
---
apiVersion: v1
kind: Service
metadata:
  name: nginx
  namespace: appflowy
spec:
  selector: { app: nginx }
  ports:
    - { name: http, port: 80, targetPort: 80 }
