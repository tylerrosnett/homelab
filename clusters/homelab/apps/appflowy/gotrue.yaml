apiVersion: apps/v1
kind: Deployment
metadata:
  name: gotrue
  namespace: appflowy
spec:
  replicas: 1
  selector:
    matchLabels: { app: gotrue }
  template:
    metadata:
      labels: { app: gotrue }
    spec:
      containers:
        - name: gotrue
          image: appflowyinc/gotrue:0.16.5
          envFrom:
            - configMapRef: { name: appflowy-env }
          env:
            - name: PORT
              value: "9999"
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: appflowy-secrets, key: POSTGRES_PASSWORD } }
            - name: DATABASE_URL
              value: "postgres://postgres:$(POSTGRES_PASSWORD)@postgres:5432/postgres?search_path=auth"
            - name: GOTRUE_JWT_SECRET
              valueFrom: { secretKeyRef: { name: appflowy-secrets, key: GOTRUE_JWT_SECRET } }
            - name: GOTRUE_ADMIN_EMAIL
              valueFrom: { secretKeyRef: { name: appflowy-secrets, key: GOTRUE_ADMIN_EMAIL } }
            - name: GOTRUE_ADMIN_PASSWORD
              valueFrom: { secretKeyRef: { name: appflowy-secrets, key: GOTRUE_ADMIN_PASSWORD } }
            - name: GOTRUE_SAML_PRIVATE_KEY
              valueFrom: { secretKeyRef: { name: appflowy-secrets, key: GOTRUE_SAML_PRIVATE_KEY } }
          ports:
            - { name: http, containerPort: 9999 }
          readinessProbe:
            httpGet: { path: /health, port: 9999 }
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 12
---
apiVersion: v1
kind: Service
metadata:
  name: gotrue
  namespace: appflowy
spec:
  selector: { app: gotrue }
  ports:
    - { name: http, port: 9999, targetPort: 9999 }
