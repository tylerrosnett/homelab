apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: appflowy-search-index
  namespace: appflowy
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: longhorn
  resources:
    requests: { storage: 1Gi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: appflowy-search
  namespace: appflowy
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: appflowy-search }
  template:
    metadata:
      labels: { app: appflowy-search }
    spec:
      containers:
        - name: appflowy-search
          image: appflowyinc/appflowy_search
          envFrom:
            - configMapRef: { name: appflowy-env }
          env:
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: appflowy-secrets, key: POSTGRES_PASSWORD } }
            - name: APPFLOWY_SEARCH_DATABASE_URL
              value: "postgres://postgres:$(POSTGRES_PASSWORD)@postgres:5432/postgres"
            - name: APPFLOWY_SEARCH_REDIS_URL
              value: "redis://redis:6379"
            - name: APPFLOWY_GOTRUE_JWT_SECRET
              valueFrom: { secretKeyRef: { name: appflowy-secrets, key: GOTRUE_JWT_SECRET } }
            - name: APPFLOWY_S3_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: appflowy-secrets, key: AWS_ACCESS_KEY } }
            - name: APPFLOWY_S3_SECRET_KEY
              valueFrom: { secretKeyRef: { name: appflowy-secrets, key: AWS_SECRET } }
          ports:
            - { name: http, containerPort: 4002 }
          volumeMounts:
            - { name: index, mountPath: /var/lib/appflowy/keyword_index }
      volumes:
        - name: index
          persistentVolumeClaim: { claimName: appflowy-search-index }
---
apiVersion: v1
kind: Service
metadata:
  name: appflowy-search
  namespace: appflowy
spec:
  selector: { app: appflowy-search }
  ports:
    - { name: http, port: 4002, targetPort: 4002 }
