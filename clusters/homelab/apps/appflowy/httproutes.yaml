apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: appflowy-internal
  namespace: appflowy
spec:
  parentRefs:
    - name: cilium-gateway
      namespace: kube-system
  hostnames:
    - appflowy.internal.tylerrosnett.com
  rules:
    - backendRefs:
        - name: nginx
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: appflowy-public
  namespace: appflowy
spec:
  parentRefs:
    - name: cf-tunnel
      namespace: kube-system
  hostnames:
    - appflowy.tylerrosnett.com
  rules:
    - backendRefs:
        - name: nginx
          port: 80
