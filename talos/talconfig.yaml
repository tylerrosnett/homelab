clusterName: homelab
endpoint: https://192.168.1.246:6443  # Talos VIP

talosVersion: v1.13.7
kubernetesVersion: v1.36.3

cniConfig:
  name: none  # Cilium installed out-of-band

allowSchedulingOnControlPlanes: true  # compact 3-node cluster — workloads share controlplanes

additionalApiServerCertSans:
  - 192.168.1.246

nodes:
  - hostname: oak
    ipAddress: 192.168.1.5
    installDiskSelector:
      size: '>= 200GB'
      type: ssd
    controlPlane: true
    networkInterfaces:
      - interface: eno1
        dhcp: false
        addresses:
          - 192.168.1.5/24
        routes:
          - network: 0.0.0.0/0
            gateway: 192.168.1.1
        vip:
          ip: 192.168.1.246

  - hostname: maple
    ipAddress: 192.168.1.6
    installDiskSelector:
      size: '>= 200GB'
      type: ssd
    controlPlane: true
    networkInterfaces:
      - interface: eno1
        dhcp: false
        addresses:
          - 192.168.1.6/24
        routes:
          - network: 0.0.0.0/0
            gateway: 192.168.1.1
        vip:
          ip: 192.168.1.246

  - hostname: pine
    ipAddress: 192.168.1.7
    installDiskSelector:
      size: '>= 200GB'
      type: ssd
    controlPlane: true
    networkInterfaces:
      - interface: eno1
        dhcp: false
        addresses:
          - 192.168.1.7/24
        routes:
          - network: 0.0.0.0/0
            gateway: 192.168.1.1
        vip:
          ip: 192.168.1.246

controlPlane:
  schematic:
    customization:
      systemExtensions:
        officialExtensions:
          - siderolabs/iscsi-tools
          - siderolabs/util-linux-tools
  patches:
    - "@./patches/cluster-cni-none.yaml"
    - "@./patches/cluster-proxy-disabled.yaml"
    - "@./patches/cluster-apiserver-oidc.sops.yaml"
    - "@./patches/cluster-apiserver-audit.yaml"
    - "@./patches/cluster-scheduler-controller-bind.yaml"
    - "@./patches/machine-kubelet.yaml"

patches:
  - "@./patches/machine-time.yaml"
  - "@./patches/machine-longhorn.yaml"
