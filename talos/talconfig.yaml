clusterName: homelab
endpoint: https://10.10.10.246:6443  # Talos VIP

talosVersion: v1.14.1
kubernetesVersion: v1.36.4

cniConfig:
  name: none  # Cilium installed out-of-band

allowSchedulingOnControlPlanes: true  # compact 3-node cluster — workloads share controlplanes

additionalApiServerCertSans:
  - 10.10.10.246

nodes:
  - hostname: oak
    ipAddress: 10.10.10.5
    installDiskSelector:
      size: '>= 200GB'
      type: ssd
    controlPlane: true
    networkInterfaces:
      - interface: eno1
        dhcp: false
        addresses:
          - 10.10.10.5/24
        routes:
          - network: 0.0.0.0/0
            gateway: 10.10.10.1
        vip:
          ip: 10.10.10.246

  - hostname: maple
    ipAddress: 10.10.10.6
    installDiskSelector:
      size: '>= 200GB'
      type: ssd
    controlPlane: true
    networkInterfaces:
      - interface: eno1
        dhcp: false
        addresses:
          - 10.10.10.6/24
        routes:
          - network: 0.0.0.0/0
            gateway: 10.10.10.1
        vip:
          ip: 10.10.10.246

  - hostname: pine
    ipAddress: 10.10.10.7
    installDiskSelector:
      size: '>= 200GB'
      type: ssd
    controlPlane: true
    networkInterfaces:
      - interface: eno1
        dhcp: false
        addresses:
          - 10.10.10.7/24
        routes:
          - network: 0.0.0.0/0
            gateway: 10.10.10.1
        vip:
          ip: 10.10.10.246

controlPlane:
  schematic:
    customization:
      systemExtensions:
        officialExtensions:
          - siderolabs/iscsi-tools
          - siderolabs/util-linux-tools
  patches:
    - "@./patches/cluster-proxy-disabled.yaml"
    - "@./patches/cluster-apiserver-oidc.sops.yaml"
    - "@./patches/cluster-apiserver-audit.yaml"
    - "@./patches/cluster-scheduler-controller-bind.yaml"
    - "@./patches/cluster-etcd-metrics.yaml"
    - "@./patches/machine-kubelet.yaml"

worker:
  schematic:
    customization:
      systemExtensions:
        officialExtensions:
          - siderolabs/iscsi-tools
          - siderolabs/util-linux-tools
          - siderolabs/qemu-guest-agent
  patches:
    - "@./patches/machine-kubelet.yaml"

patches:
  - "@./patches/machine-time.yaml"
  - "@./patches/machine-longhorn.yaml"
  - "@./patches/machine-sysctls-thread.yaml"
